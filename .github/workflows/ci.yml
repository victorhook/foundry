name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pushing three times in a row used to leave three full pipelines running, with
# the useful one queued behind the stale ones. Supersede instead — except on
# main, where a run ends in a deploy that must not be interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # --prefer-offline uses the restored cache instead of re-fetching tarballs;
      # audit/fund are network round-trips whose output nobody reads in CI.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Cache the Playwright browser binaries so we don't re-download Chromium
      # (~100 MB) every run. Keyed on the lockfile — a Playwright version bump
      # changes the lock, which busts the cache and pulls the matching browser.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # On a cache hit the browser is already on disk, and ubuntu-latest ships the
      # shared libraries Chromium needs — so the apt round-trip that used to run
      # on every green build is skipped entirely. If a runner image ever drops one
      # of those libs, Chromium fails to launch: put `--with-deps` back by
      # removing the `if:` below.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # Only useful when something failed; uploading it on every green run costs
      # time and 7 days of storage for a report nobody opens.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Build on the runner (self-contained). Reusing the test job's build via an
      # artifact once shipped a manifest whose chunk files were missing and 500'd
      # prod, so we keep the deploy build independent and known-consistent.
      - name: Install deps & build
        run: npm ci --prefer-offline --no-audit --fund=false && npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship to VPS
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete -e ssh build "$SSH_TARGET:$DEPLOY_PATH/"
          rsync -az -e ssh package.json package-lock.json deploy scripts "$SSH_TARGET:$DEPLOY_PATH/"
          ssh "$SSH_TARGET" "cd '$DEPLOY_PATH' && bash deploy/backup.sh && npm ci --omit=dev && sudo systemctl restart foundry"
