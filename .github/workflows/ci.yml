name: CI

# Advisory test suite — type-check, unit and e2e. It does NOT gate deployment
# (see deploy.yml, which ships independently); it's here to surface regressions
# after the fact, so a red run is a heads-up, not a blocker.
on:
  push:
    branches: [main]
  pull_request:

# Nothing downstream depends on these runs any more, so always supersede an
# in-flight run when a newer commit lands — including on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  # Type-check, unit tests and a production build. Fast, and independent of the
  # browser suite — so it runs alongside it rather than in front of it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # --prefer-offline uses the restored cache instead of re-fetching tarballs;
      # audit/fund are network round-trips whose output nobody reads in CI.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # One job per spec file. Measured serially the suite is ~71s; the three files
  # are ~28s / ~21s / ~23s, so the slowest one sets the wall clock.
  #
  # Explicit files rather than `--shard`: with fullyParallel disabled Playwright
  # shards at file granularity and packs unevenly (it gave one shard 14 tests,
  # another 11 and a third none). Add a spec file → add it here.
  #
  # Each job gets its own server and its own SQLite file, so every spec must pass
  # standalone against an empty database, not just as part of the whole suite.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        spec: [workouts, nutrition-media, chat-and-library]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      # Cache the Playwright browser binaries so we don't re-download Chromium
      # (~100 MB) every run. Keyed on the lockfile — a Playwright version bump
      # changes the lock, which busts the cache and pulls the matching browser.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      # On a cache hit the browser is already on disk, and ubuntu-latest ships the
      # shared libraries Chromium needs — so the apt round-trip that used to run
      # on every green build is skipped entirely. If a runner image ever drops one
      # of those libs, Chromium fails to launch: put `--with-deps` back by
      # removing the `if:` below.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e -- e2e/${{ matrix.spec }}.spec.ts

      # Only useful when something failed; uploading it on every green run costs
      # time and 7 days of storage for a report nobody opens.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.spec }}
          path: app/playwright-report
          retention-days: 7
