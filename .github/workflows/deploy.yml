name: Deploy

# Fast path to production, deliberately gated on NOTHING. A push to main builds
# and ships straight away; the test suite (ci.yml) runs in parallel as an
# advisory signal and never blocks or delays this. Trade-off chosen on purpose:
# a broken deploy is cheap to fix here, a slow/friction-heavy deploy is not.
on:
  push:
    branches: [main]

# Deploys never interrupt each other — a push mid-ship queues behind the running
# one rather than cancelling it. Rapid pushes serialise here without waiting on
# any test run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Build on the runner (self-contained). Reusing the test job's build via an
      # artifact once shipped a manifest whose chunk files were missing and 500'd
      # prod, so we keep the deploy build independent and known-consistent.
      - name: Install deps & build
        run: npm ci --prefer-offline --no-audit --fund=false && npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship to VPS
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Only reinstall node_modules on the box when the lockfile actually
          # changed — otherwise a restart is all it takes, saving ~30-60s on the
          # common (no-dependency-change) deploy. Compare before rsync overwrites it.
          LOCAL_HASH=$(sha256sum package-lock.json | cut -d' ' -f1)
          REMOTE_HASH=$(ssh "$SSH_TARGET" "sha256sum '$DEPLOY_PATH/package-lock.json' 2>/dev/null | cut -d' ' -f1" || true)

          rsync -az --delete -e ssh build "$SSH_TARGET:$DEPLOY_PATH/"
          rsync -az -e ssh package.json package-lock.json deploy scripts "$SSH_TARGET:$DEPLOY_PATH/"

          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "Dependencies changed — reinstalling on the server."
            ssh "$SSH_TARGET" "cd '$DEPLOY_PATH' && bash deploy/backup.sh && npm ci --omit=dev && sudo systemctl restart foundry"
          else
            echo "Dependencies unchanged — skipping npm ci."
            ssh "$SSH_TARGET" "cd '$DEPLOY_PATH' && bash deploy/backup.sh && sudo systemctl restart foundry"
          fi
